
name: Build Porter Auto Helper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "$ANDROID_HOME"
          ls "$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip -q PorterAutoHelper_Android_Starter.zip -d project
          find project -maxdepth 3 -type f | head -80

      
      - name: Build APK
        run: |
          cd project
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )
              p.write_text(s)

          print("Java target configuration checked.")
          PY
          gradle assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PorterAutoHelper-debug
          path: project/**/build/outputs/apk/debug/*.apk
